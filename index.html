<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>우리 반 이주 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe7d4;--panel:#fbf6ea;--card:#fffdf7;--ink:#2d2418;--sub:#6c5f4c;--line:#d9ccb0;--wood:#6a3a1a;--sea:#cfe3ec;--land:#f4ecd8;--land2:#ebe2cc;--bd:#b9ab8d;--grat:#bad3df;--hov:#ffe08a;--ok:#2e7d4f;--bad:#b3402b;--gold:#f2b705;
 --eu:#3b7dd8;--af:#e8892a;--as:#d9ad0f;--na:#d63c3c;--mx:#8e5fd0;--hi:#d6609b;--ot:#9aa1a8;box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a15;--panel:#26221c;--card:#2e2922;--ink:#efe7d6;--sub:#b7aa93;--line:#4a4236;--wood:#3e2410;--sea:#1c2d36;--land:#3b352b;--land2:#332e25;--bd:#5d5446;--grat:#26404d;--hov:#6b5a22;--ok:#7fcf9c;--bad:#f09582;--eu:#76a8ee;--af:#f2a65a;--as:#f0cc4a;--na:#f07070;--mx:#b38cf0;--hi:#f08cc0;--ot:#8b9196;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a15;--panel:#26221c;--card:#2e2922;--ink:#efe7d6;--sub:#b7aa93;--line:#4a4236;--wood:#3e2410;--sea:#1c2d36;--land:#3b352b;--land2:#332e25;--bd:#5d5446;--grat:#26404d;--hov:#6b5a22;--ok:#7fcf9c;--bad:#f09582;--eu:#76a8ee;--af:#f2a65a;--as:#f0cc4a;--na:#f07070;--mx:#b38cf0;--hi:#f08cc0;--ot:#8b9196;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--wood);z-index:20}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.disp,header h1,.phead h2,.am h3,#mq{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.01em}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{background:var(--wood);color:#f8eedb;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;border-bottom:4px solid #4a2610}
header h1{font-size:23px;margin:0;white-space:nowrap}
.views{display:flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px}
.views button{border:0;background:none;color:#e8d9bd;padding:7px 16px;border-radius:8px;font-weight:500}
.views button[aria-pressed=true]{background:#f8eedb;color:var(--wood);font-weight:700}
#people{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13.5px;color:#e8d9bd}
#people b{color:#fff}
.chips{display:flex}.chips i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;font-weight:700;border:2px solid var(--wood);margin-left:-6px}
main{display:grid;grid-template-columns:minmax(320px,410px) 1fr;min-height:0}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}#panel{max-height:40vh}}
#panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:16px 16px 24px}
.phead{border-left:6px solid var(--c,var(--wood));padding:2px 0 2px 12px;margin-bottom:14px}
.phead h2{margin:2px 0 4px;font-size:27px;line-height:1.2}
.phead p{margin:0;color:var(--sub);font-size:14px}
.phead .era{color:var(--c);font-size:14px}.phead .era b{font-weight:700}
.prog{height:10px;background:var(--line);border-radius:5px;margin:8px 0 3px;overflow:hidden}.prog span{display:block;height:100%;background:var(--c);transition:width .4s}
.pc{font-size:13px!important}
.back{border:0;background:none;color:var(--sub);padding:0;font-size:13px;text-decoration:underline;margin-bottom:6px}
.pblock{border-left:6px solid var(--c);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.pblock .pt{margin:0 0 8px;font-size:14px}.pblock .pt b{color:var(--c);font-size:16px;margin-right:4px}
.gp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gp button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.gp button:hover{border-color:var(--c)}
.gp b{font-size:17px;font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400}.gp span{font-size:12.5px;color:var(--sub);line-height:1.4}
ol.cards{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{display:grid;grid-template-columns:34px 1fr;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 13px 11px 10px;box-shadow:0 3px 0 var(--line)}
.card:hover{border-color:var(--c)}
.card.on{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
.card .cn{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;display:grid;place-items:center}
.card.done .cn{background:var(--ok)}
.cb{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ct b{font-size:15.5px}.ct em{font-style:normal;font-size:12.5px;color:var(--sub);white-space:nowrap}
.cx{font-size:14px;line-height:1.6}
.cs{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:5px;margin-top:2px}
.card.done .cs{color:var(--ok);font-weight:700}
.ghost{margin-top:14px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:13px}
.danger{color:var(--bad)}
.legend{display:grid;gap:5px;font-size:13.5px;margin:6px 0 14px}
.legend .lh{margin:8px 0 0;font-weight:700;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}.legend i{width:22px;height:6px;border-radius:3px}
.legend .ls{color:var(--sub)}
.pk{display:flex;flex-wrap:wrap;gap:4px 12px}.pk i{width:12px!important;height:12px!important;border-radius:3px!important}
.tot{margin-top:8px!important;font-size:15px!important;color:var(--ink)!important}.tot b{font-size:24px}
.glist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.glist li{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.glist label{display:flex;gap:8px;align-items:center;cursor:pointer}.glist label span{color:var(--sub);font-size:13px}.cnt{font-variant-numeric:tabular-nums;color:var(--sub)}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--sea)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
.sea{fill:var(--sea)}.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.ctry{fill:var(--land2);stroke:var(--bd);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .15s,opacity .3s}
.ctry.am{fill:var(--land)}
.picking .ctry{cursor:pointer}.picking .ctry:hover{fill:var(--hov)}
.ctry.dim{opacity:.3}
.ctry.bad{fill:var(--bad)}.ctry.blink{animation:bl .9s infinite}@keyframes bl{50%{fill:var(--gold)}}
.ripple{fill:none;stroke-width:2.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:rip 1.6s ease-out forwards}@keyframes rip{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(9)}}
.live.mine{stroke-width:3.2;opacity:1}#map.mev .live.mine{opacity:1}
#feed{position:absolute;left:12px;top:12px;display:grid;gap:6px;z-index:4;max-width:min(380px,calc(100% - 80px));pointer-events:none}
#feed .fi{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:6px 10px;font-size:13.5px;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:fin .45s cubic-bezier(.2,1.3,.4,1) both;transition:opacity .5s,transform .5s}
#feed .fi.out{opacity:0;transform:translateX(-12px)}@keyframes fin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#people{display:flex;align-items:center;gap:10px}#people .pbar{width:110px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}#people .pbar i{display:block;height:100%;background:#f2c46d;transition:width .6s}
#people .onl{display:flex;align-items:center;gap:5px}#people .onl i{width:8px;height:8px;border-radius:50%;background:#7fdc9a;box-shadow:0 0 0 3px rgba(127,220,154,.3)}
#pw{position:fixed;inset:0;background:rgba(20,30,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.pwbox{background:var(--card);border:4px solid var(--wood);border-radius:14px;padding:16px 18px;width:min(420px,100%);display:grid;gap:8px}.pwbox h3{margin:0;font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;font-size:23px}.pwbox p{margin:0;font-size:14px;color:var(--sub)}.pwbox .ghost{justify-self:end}
.waitc{margin:0;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.zone{pointer-events:none;fill:rgba(242,183,5,.18);stroke:var(--gold);stroke-width:3;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;animation:zn 1.2s infinite}@keyframes zn{50%{opacity:.35}}
.inbox{fill:var(--sea)}.inline{fill:none;stroke:var(--wood);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.inlab{font-size:12px;font-weight:700;fill:var(--sub)}
.flow{fill:none;stroke-width:2.8;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.95}
.flow.force{stroke-dasharray:7 5}.flow.sel{stroke-width:4.2}
.xm{font-size:16px;font-weight:700;text-anchor:middle}
.odot{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.sl{stroke:var(--card);stroke-width:1;vector-effect:non-scaling-stroke}.sl.hl{stroke:var(--ink);stroke-width:1.8}
.plab{font-size:11px;font-weight:700;text-anchor:middle;fill:var(--ink);stroke:var(--sea);stroke-width:3px;paint-order:stroke}
.live{fill:none;stroke-width:1.6;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.7}.live.force{stroke-dasharray:5 4}.live.new{animation:drawin 1.4s ease-out}@keyframes drawin{from{stroke-dasharray:900;stroke-dashoffset:900;opacity:1}to{stroke-dasharray:900;stroke-dashoffset:0}}
#map.mev .live{opacity:.3}
.pend{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.hbtn{margin-left:auto;border:1px solid rgba(248,238,219,.5);background:none;color:#f8eedb;border-radius:20px;padding:4px 12px;font-size:13px}.hbtn[aria-pressed=false]{opacity:.55;text-decoration:line-through}
#people{margin-left:8px!important}
.cname{font-size:12px;font-weight:700;fill:#fff}
.mission{position:absolute;left:12px;right:12px;top:12px;max-width:660px;margin:0 auto;background:var(--card);border:3px solid var(--wood);border-radius:14px;padding:10px 14px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;z-index:3}
.mission.ok{border-color:var(--ok)}.mission.bad{border-color:var(--bad)}
#mq{font-size:21px;line-height:1.25}#mm{grid-column:1;font-size:13.5px;color:var(--sub)}.mission.bad #mm{color:var(--bad);font-weight:500}.mission.ok #mm{color:var(--ok);font-weight:500}
.macts{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:6px}
.macts button{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px;box-shadow:0 2px 0 var(--line)}
#conts{grid-column:1/3;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
#conts:empty{display:none}
#conts button{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px;font-weight:700;font-size:13.5px;box-shadow:0 3px 0 var(--line);border-left-width:8px}
#conts button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.k-eu{border-left-color:#3b7dd8!important}.k-af{border-left-color:#e8892a!important}.k-as{border-left-color:#d9ad0f!important}.k-na,.k-sa{border-left-color:#8dbf57!important}
@media (max-width:640px){#conts{grid-template-columns:repeat(3,1fr)}.macts{grid-row:auto;grid-column:1/3;flex-direction:row}}
.zoom{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:42px;height:42px;border:2px solid var(--line);background:var(--card);border-radius:10px;font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.zoom button.all{font-size:12px}
#tip{position:absolute;pointer-events:none;background:var(--wood);color:#fff;font-size:13.5px;font-weight:500;padding:3px 9px;border-radius:6px;z-index:4;white-space:nowrap}
#note{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100% - 80px));background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;z-index:3}
#arrive{position:absolute;inset:0;background:rgba(32,20,8,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:6}
.am{background:var(--card);border:4px solid var(--wood);border-radius:14px;width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 6px 0 #4a2610,0 18px 40px rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.ah{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--wood);color:#f8eedb}
.ah small{color:#f2c46d;font-weight:700;font-size:13px}.ah h3{margin:0;font-size:25px;line-height:1.2}.ah p{margin:2px 0 0;font-size:14px}
.stamp{border:3px solid var(--gold);color:var(--gold);border-radius:8px;padding:0 10px;font-family:"Do Hyeon",sans-serif;font-size:24px;transform:rotate(-8deg);animation:st .5s cubic-bezier(.2,1.6,.4,1) both .15s}
@keyframes st{from{opacity:0;transform:rotate(-8deg) scale(2.2)}to{opacity:1;transform:rotate(-8deg)}}
.ab{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center;padding:16px 18px}
@media (max-width:520px){.ab{grid-template-columns:1fr}.bigpie{max-width:150px;margin:0 auto}}
.bigpie{width:100%;height:auto;display:block}
.al{margin:0 18px 0 0;font-size:15.5px;line-height:1.6}.ab .al{margin:0}
.am>.al{padding:16px 18px}
.leg{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:13.5px}
.leg li{display:flex;align-items:center;gap:6px;color:var(--sub)}.leg li.hl{color:var(--ink);font-weight:700}.leg i{width:11px;height:11px;border-radius:3px}.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--sub);margin:8px 0 0}
.af{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:500;box-shadow:0 3px 0 var(--line)}
.btn.primary{background:var(--wood);color:#f8eedb;border-color:#4a2610;box-shadow:0 3px 0 #4a2610;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:2px solid var(--line);border-top:7px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.role:hover{border-color:var(--c)}
.role .rc{font-size:12.5px;font-weight:700;color:var(--c)}.role b{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;font-size:24px;line-height:1.2}.role .re{font-size:12.5px;color:var(--sub)}
.role .rn{position:absolute;right:8px;top:8px;font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--sub)}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.steps li{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--sub)}
.steps li.on{background:var(--c);color:#fff;font-weight:700}.steps li.ok{background:var(--ok);color:#fff}
.story{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.story p{margin:0 0 8px;font-size:15px;line-height:1.75}.story p:last-child{margin:0}
.task{display:grid;gap:8px}
.tq{margin:0;font-size:15px}.small{margin:0;font-size:13px;color:var(--sub)}
.lab{margin:4px 0 0;font-weight:700;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-weight:500;box-shadow:0 2px 0 var(--line)}
.chips button[aria-pressed=true]{background:var(--wood);border-color:var(--wood);color:#f8eedb}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.task .btn,.task .ghost{justify-self:start;margin-top:4px}
.msg{margin:8px 0 0;font-size:13.5px;min-height:1.2em}.msg.bad{color:var(--bad);font-weight:500}
.sum{background:var(--card);border:2px solid var(--ok);border-radius:12px;padding:10px 12px}
.sum .sh{margin:0 0 6px;font-weight:700;color:var(--ok)}
.sum table{width:100%;border-collapse:collapse;font-size:14px}.sum th,.sum td{border-top:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}.sum th{color:var(--sub);font-weight:500;width:42%}
.pbox{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.pbox .pt{margin:0 0 4px;font-size:13.5px}
.tctl{background:var(--wood);color:#f8eedb;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.tctl p{margin:0 0 8px;font-size:13px}.tctl div{display:flex;gap:8px;flex-wrap:wrap}
.order{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px}
.order li{display:grid;grid-template-columns:26px 1fr;column-gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px;opacity:.6}
.order li.on{border-left-color:var(--c);opacity:1}
.order li b{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;grid-row:1/3}.order li.on b{background:var(--c);color:#fff}
.order li>div{font-weight:700}.tctl .ghost{background:#f8eedb;color:#4a2610;border-color:#f8eedb}.tctl .ghost[disabled]{opacity:.45}
.order li span{font-weight:400;font-size:12.5px;color:var(--sub)}
.rt{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:8px;overflow:hidden}
.rt th,.rt td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}.rt th{background:var(--panel)}
.rt td:first-child{border-left:5px solid var(--c)}.rt td b{color:var(--c);font-size:12px;display:block}
.qs{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:10px 12px;margin-top:12px}
.qs .sh{margin:0 0 4px;font-weight:700}.qs ol{margin:0;padding-left:18px;font-size:14px}
.fin{display:grid;gap:6px;justify-items:start;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--sub)}.lg span{display:flex;align-items:center;gap:6px}
.pin{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.star{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}

  story:['나는 마리아야. 우리 마을은 남아메리카 서쪽을 따라 길게 뻗은 높은 산맥의 고원에 있어. 적도에서 멀지 않지만 땅이 높아서 일 년 내내 서늘해.','할머니는 에스파냐어보다 조상의 말인 케추아어를 더 편하게 쓰셔. 우리 조상은 이 산맥을 따라 잉카 제국을 세웠대.','우리 가족은 다른 곳에서 이 땅으로 옮겨 온 적이 없어. 처음부터 여기서 살아왔지.'],
  hint:'남아메리카 서쪽, 안데스산맥이 지나는 나라야. 잉카 제국의 중심이었던 곳이야.'},
 {id:'xochitl',cat:'na',who:'소치틀',nat:'멕시코',natAlt:['멕시코'],era:'오늘날',per:'배경',stay:true,home:['484'],homeP:[185.6,335.9],homeName:'멕시코 중앙 고원',mot:2,pur:3,w:2300,
  story:['나는 소치틀이야. 내 이름은 우리 조상의 말인 나우아틀어로 \'꽃\'이라는 뜻이야.','우리 마을은 북아메리카 남쪽 나라의 높은 고원에 있어. 먼 옛날 우리 조상은 호수 위에 큰 도시를 세우고 아스테카 제국을 이루었대.','우리 가족은 대대로 이곳에서 옥수수를 기르며 살아왔어. 다른 곳에서 옮겨 온 적이 없어.'],
  hint:'미국 바로 남쪽에 있는 나라야. 아스테카 제국의 중심이었던 곳이야.'},
 {id:'ixchel',cat:'na',who:'익스첼',nat:'과테말라',natAlt:['과테말라'],era:'오늘날',per:'배경',stay:true,home:['320'],homeP:[224.8,362.4],homeName:'과테말라 서부 고지대',mot:2,pur:3,w:700,
  story:['나는 익스첼이야. 우리 마을은 북아메리카와 남아메리카를 잇는 좁고 긴 땅, 화산이 많은 고지대에 있어.','엄마는 마야 사람들의 전통 무늬로 옷감을 짜고, 우리 집에서는 마야 말을 써.','우리 조상은 아주 먼 옛날부터 이곳에서 피라미드 신전을 세우며 마야 문명을 꽃피웠어. 우리 가족은 다른 곳에서 옮겨 온 적이 없어.'],
  hint:'멕시코 바로 남동쪽, 중앙아메리카에 있는 나라야.'},
 {id:'wara',cat:'na',who:'와라',nat:'볼리비아',natAlt:['볼리비아'],era:'오늘날',per:'배경',stay:true,home:['068'],homeP:[355.7,570.8],homeName:'볼리비아 알티플라노',mot:2,pur:3,w:600,
  story:['나는 와라야. 우리 마을은 안데스산맥 사이에 펼쳐진 넓고 높은 고원, 알티플라노에 있어. 근처에는 커다란 호수인 티티카카호가 있어.','우리 가족은 아이마라 말을 쓰고, 추운 고원에서 감자를 기르고 라마와 알파카를 키워.','우리 조상은 처음부터 이 고원에서 살아왔어. 우리 가족은 다른 곳에서 옮겨 온 적이 없어.'],
  hint:'페루의 동남쪽, 바다와 맞닿지 않은 남아메리카 내륙 나라야.'},

 {id:'antonio',cat:'eu',who:'안토니오',nat:'에스파냐',natAlt:['에스파냐','스페인'],era:'1520년대',per:'1500~1914년',from:['724'],fromP:[694.6,213.6],fromName:'에스파냐(세비야)',to:'484',toP:[182.4,333.2],toName:'멕시코(멕시코시티)',mot:0,pur:1,w:50,
  story:['나는 안토니오야. 유럽 남서쪽 끝 반도의 항구 도시 세비야에서 왔어. 신대륙으로 가는 배는 모두 이 항구에서 떠났지.','1521년, 우리 나라 군대가 바다 건너 아스테카 제국을 무너뜨렸다는 소식이 들렸어. 그 땅에는 은이 묻힌 산과 넓은 땅이 있다고 했어.','나는 은광과 농장에서 한몫 잡으려고 배를 탔어. 도착한 곳은 아스테카의 도시 위에 새로 세워진 식민지의 수도였어.'],
  hf:'유럽 남서쪽 끝, 이베리아반도의 큰 나라야.',ht:'미국 바로 남쪽 나라, 아스테카 제국이 있던 곳이야.'},
 {id:'joao',cat:'eu',who:'조앙',nat:'포르투갈',natAlt:['포르투갈'],era:'1720년대',per:'1500~1914년',from:['620'],fromP:[677.2,205],fromName:'포르투갈(리스본)',to:'076',toP:[491.7,593.4],toName:'브라질(미나스제라이스)',mot:0,pur:1,w:200,
  story:['나는 조앙이야. 유럽 서쪽 끝, 대서양과 맞닿은 작은 나라의 항구 리스본에서 왔어.','우리 나라 식민지인 남아메리카의 큰 땅 내륙에서 금이 쏟아져 나온다는 소문이 퍼졌어. 수많은 사람이 금을 찾아 배를 탔지.','나도 대서양을 건너 그 식민지의 산악 지대로 들어갔어. 그곳의 이름은 \'넓은 광산\'이라는 뜻의 미나스제라이스였어.'],
  hf:'에스파냐 서쪽, 대서양과 맞닿은 나라야.',ht:'남아메리카에서 가장 큰 나라야.'},
 {id:'william',cat:'eu',who:'윌리엄',nat:'영국',natAlt:['영국','잉글랜드'],era:'1620년',per:'1500~1914년',from:['826'],fromP:[702.5,115.4],fromName:'영국',to:'840',toP:[351.6,181.9],toName:'미국(매사추세츠)',mot:0,pur:2,w:440,
  story:['나는 윌리엄이야. 우리 가족은 유럽 서쪽 바다 위의 섬나라에 살았어.','우리는 나라에서 정한 교회와 다른 방식으로 신앙을 지키려 했는데, 그 때문에 박해를 받았어. 마음 놓고 신앙생활을 할 수 있는 곳이 필요했지.','1620년, 우리는 메이플라워호를 타고 대서양을 건넜어. 배가 닿은 곳은 북아메리카 동북쪽 바닷가였고, 우리는 그곳에 마을을 세웠어.'],
  hf:'유럽 서쪽, 바다 위에 떠 있는 섬나라야.',ht:'북아메리카 동북쪽 바닷가, 오늘날 가장 큰 나라야.'},
 {id:'bridget',cat:'eu',who:'브리짓',nat:'아일랜드',natAlt:['아일랜드'],era:'1847년',per:'1500~1914년',from:['372'],fromP:[669.9,112.2],fromName:'아일랜드',to:'840',toP:[334.8,191.8],toName:'미국(뉴욕)',mot:0,pur:1,w:440,
  story:['나는 브리짓이야. 우리 집은 영국 옆 섬나라의 작은 농촌에 있어. 우리는 거의 감자만 먹고 살았어.','몇 해 전부터 감자가 밭에서 검게 썩어 버리는 병이 돌았어. 먹을 것이 없어 굶어 죽는 사람이 셀 수 없이 많았지.','1847년, 나는 오빠와 함께 대서양을 건너는 배를 탔어. 도착한 곳은 북아메리카 동부의 큰 항구 도시였고, 나는 그곳에서 가정부로 일하기 시작했어.'],
  hf:'영국 서쪽의 섬나라야.',ht:'북아메리카 동부 해안의 가장 큰 항구 도시, 오늘날 가장 큰 나라에 있어.'},
 {id:'karl',cat:'eu',who:'카를',nat:'독일',natAlt:['독일'],era:'1849년',per:'1500~1914년',from:['276'],fromP:[758.1,131.3],fromName:'독일',to:'840',toP:[256.7,176],toName:'미국 중서부(위스콘신)',mot:0,pur:0,w:550,
  story:['나는 카를이야. 유럽 한가운데 여러 작은 나라로 나뉘어 있던 땅에서 살았어.','1848년, 우리는 왕의 힘을 줄이고 국민이 뜻을 펼치는 나라를 만들자며 혁명에 나섰어. 하지만 혁명은 실패했고, 나는 붙잡힐까 봐 고향을 떠나야 했어.','나는 대서양을 건너 북아메리카의 큰 호수들 근처, 독일 사람들이 많이 모여 사는 농촌 지역에 자리 잡았어.'],
  hf:'유럽 한가운데, 프랑스의 동쪽에 있는 나라야.',ht:'북아메리카 오대호 근처, 오늘날 가장 큰 나라의 중서부야.'},
 {id:'giuseppe',cat:'eu',who:'주세페',nat:'이탈리아',natAlt:['이탈리아'],era:'1900년 무렵',per:'1500~1914년',from:['380'],fromP:[806.6,192.4],fromName:'이탈리아 남부',to:'032',toP:[414.6,691.1],toName:'아르헨티나(부에노스아이레스)',mot:0,pur:1,w:440,
  story:['나는 주세페야. 우리 마을은 지도에서 장화처럼 생긴 반도의 남쪽에 있어. 여름에는 비가 거의 오지 않아 땅이 바짝 말라.','좋은 땅은 몇몇 지주가 다 가지고 있어서, 우리는 땅을 빌려 농사짓고 수확의 많은 부분을 내야 해.','사촌 형이 편지를 보냈어. "남반구의 이 나라에는 끝없이 넓은 초원, 팜파스가 있어. 일손이 모자라 품삯을 넉넉히 줘." 나는 배를 타고 대서양을 건넜어.'],
  hf:'장화처럼 생긴 반도의 나라야.',ht:'남아메리카 남쪽, 칠레의 동쪽에 넓은 초원(팜파스)이 있는 나라야.'},
 {id:'rosa',cat:'eu',who:'로사',nat:'이탈리아',natAlt:['이탈리아'],era:'1905년',per:'1500~1914년',from:['380'],fromP:[806.6,192.4],fromName:'이탈리아 남부(나폴리)',to:'840',toP:[334.8,191.8],toName:'미국(뉴욕)',mot:0,pur:1,w:410,
  story:['나는 로사야. 장화처럼 생긴 반도의 남쪽 항구 나폴리 근처에서 자랐어. 마을에는 일자리가 없고 가난한 사람이 많았어.','먼저 떠난 아버지가 편지를 보냈어. "이곳 공장과 건설 현장에는 일자리가 넘쳐. 모두 함께 와서 살자."','1905년, 우리 가족은 커다란 증기선을 타고 대서양을 건넜어. 배가 들어설 때 저 멀리 횃불을 든 커다란 여신상이 우리를 맞이해 주었어.'],
  hf:'장화처럼 생긴 반도의 나라야.',ht:'횃불을 든 여신상이 있는 북아메리카 동부의 항구 도시야.'},
 {id:'manuel',cat:'eu',who:'마누엘',nat:'에스파냐',natAlt:['에스파냐','스페인'],era:'1910년',per:'1500~1914년',from:['724'],fromP:[677.6,177.3],fromName:'에스파냐 북서부(갈리시아)',to:'032',toP:[414.6,691.1],toName:'아르헨티나(부에노스아이레스)',mot:0,pur:1,w:350,
  story:['나는 마누엘이야. 이베리아반도 북서쪽 끝, 비가 많고 땅이 잘게 나뉜 갈리시아 지방에서 왔어. 집집마다 밭이 너무 작아서 먹고살기 힘들었어.','마을 사람들이 줄지어 남아메리카로 떠났어. 그 나라는 우리와 같은 에스파냐어를 써서 일자리 구하기가 쉬웠대.','1910년, 나는 대서양을 건너 남아메리카 남쪽의 큰 항구 도시에 도착했어. 그곳 사람들은 에스파냐에서 온 사람을 모두 \'갈리시아 사람\'이라고 부를 정도였어.'],
  hf:'유럽 남서쪽 끝, 이베리아반도의 큰 나라야.',ht:'남아메리카 남쪽, 넓은 초원(팜파스)이 있는 나라야.'},

 {id:'baquaqua',cat:'af',who:'바콰콰',nat:'베냉',natAlt:['베냉'],era:'1845년',per:'1500~1914년',from:['204','566','768','288'],fromP:[752,397.5],fromName:'서아프리카(베냉)',to:'076',toP:[542.7,515.2],toName:'브라질 북동부(페르남부쿠)',mot:1,pur:1,purNote:'노동력을 원한 쪽의 목적',w:486,
  story:['나는 바콰콰야. 대서양 쪽으로 움푹 들어간 기니만에서 멀지 않은 서아프리카의 내륙 마을에서 자랐어.','어느 날 나는 붙잡혀 노예로 팔렸어. 바닷가로 끌려가 다른 사람들과 함께 배 밑바닥에 갇혔지. 너무 좁고 숨이 막혀서 바다를 건너는 동안 많은 사람이 병들었어.','배가 닿은 곳은 대서양 건너 남아메리카 동쪽 끝의 바닷가였어. 나는 나중에 자유를 얻어 이 이야기를 책으로 남겼어.'],
  hf:'기니만 가까운 서아프리카, 오늘날의 베냉 부근이야.',ht:'남아메리카에서 가장 큰 나라의 동쪽 끝 바닷가야.'},
 {id:'kwame',cat:'af',who:'쿠아메',nat:'가나',natAlt:['가나'],era:'1760년대',per:'1500~1914년',from:['288','384','768'],fromP:[735.5,420.7],fromName:'서아프리카 황금 해안(가나)',to:'388',toP:[304.3,341.9],toName:'자메이카',mot:1,pur:1,purNote:'노동력을 원한 쪽의 목적',w:340,
  story:['나는 쿠아메야. 우리 고향 바닷가는 금이 많이 나서 유럽 사람들이 \'황금 해안\'이라고 불렀어.','유럽 상인들은 금뿐 아니라 사람도 사 갔어. 나는 전쟁 포로로 잡혀 바닷가 성채의 어두운 방에 갇혀 있다가 배에 실렸어.','배는 대서양을 건너 카리브해의 한 섬에 닿았어. 영국 사람들이 다스리는 그 섬에는 사탕수수 농장이 끝없이 펼쳐져 있었어.'],
  hf:'기니만 바닷가, 금이 많이 나던 오늘날의 가나야.',ht:'쿠바 남쪽, 카리브해의 섬나라야.'},
 {id:'nzinga',cat:'af',who:'은징가',nat:'앙골라',natAlt:['앙골라'],era:'1820년대',per:'1500~1914년',from:['024','180','178'],fromP:[827.2,521.1],fromName:'중앙아프리카 서해안(앙골라)',to:'192',toP:[288.1,313.3],toName:'쿠바',mot:1,pur:1,purNote:'노동력을 원한 쪽의 목적',w:130,
  story:['나는 은징가야. 적도 남쪽, 아프리카 대륙의 서쪽 바닷가에 있는 콩고강 근처 마을에서 살았어.','그 무렵 노예 무역을 금지하는 나라가 늘었지만, 몰래 사람을 실어 나르는 배는 여전히 많았어. 나도 붙잡혀 그런 배에 실렸지.','배가 닿은 곳은 카리브해에서 가장 큰 섬이었어. 에스파냐가 다스리던 그 섬에서는 설탕이 큰돈이 되어 사탕수수 농장이 크게 늘고 있었어.'],
  hf:'적도 남쪽, 아프리카 서쪽 바닷가의 나라야.',ht:'카리브해에서 가장 큰 섬나라야.'},
 {id:'malik',cat:'af',who:'말릭',nat:'세네갈',natAlt:['세네갈','감비아'],era:'1750년대',per:'1500~1914년',from:['686','270','324','694'],fromP:[647.1,365.7],fromName:'서아프리카(세네갈·감비아)',to:'840',toP:[297,244.1],toName:'미국 남부(사우스캐롤라이나)',mot:1,pur:1,purNote:'노동력을 원한 쪽의 목적',w:39,
  story:['나는 말릭이야. 아프리카 대륙에서 가장 서쪽으로 튀어나온 땅, 강가의 마을에서 벼농사를 지으며 살았어.','어느 날 나는 붙잡혀 노예로 팔렸어. 대서양을 건너는 배 안에서 나는 고향의 논을 떠올렸어.','도착한 곳은 북아메리카 남동부의 따뜻한 바닷가였어. 그곳 농장 주인들은 벼농사를 잘 아는 아프리카 사람들을 찾고 있었어.'],
  hf:'아프리카 대륙에서 가장 서쪽, 대서양과 맞닿은 나라야.',ht:'북아메리카 남동부, 오늘날 가장 큰 나라의 따뜻한 바닷가야.'},

 {id:'ahcheng',cat:'as',who:'아청',nat:'중국',natAlt:['중국','청','청나라'],era:'1865년',per:'1500~1914년',from:['156'],fromP:[135.4,516.8],fromName:'중국(광둥)',to:'840',toP:[75.3,210.9],toName:'미국(캘리포니아)',mot:0,pur:1,w:300,
  story:['나는 아청이야. 아시아 동쪽 큰 나라의 남쪽, 무역항이 있는 광둥 지방에서 왔어. 고향은 전쟁과 가난으로 살기 어려웠어.','태평양 건너편 \'금산\'에서 금이 나고 일자리가 많다는 소문이 퍼졌어. 나는 그곳에서 산을 뚫고 철도를 놓는 일을 하게 되었지.','눈 덮인 산맥에 터널을 뚫는 일은 아주 위험했어. 하지만 우리가 놓은 철도 덕분에 대륙의 동쪽과 서쪽이 하나로 이어졌어.'],
  hf:'지도 왼쪽 아시아 상자에서 가장 큰 나라야.',ht:'북아메리카 서쪽 바닷가, 오늘날 가장 큰 나라야.'},
 {id:'kimsg',cat:'as',who:'김순길',nat:'한국',natAlt:['한국','대한민국'],era:'1970년대',per:'20세기 이후',from:['410'],fromP:[166.7,474.8],fromName:'한국(서울)',to:'840',toP:[91.2,235.8],toName:'미국(로스앤젤레스)',mot:0,pur:1,w:100,
  story:['나는 김순길이야. 한반도 남쪽 나라의 수도 서울에서 살았어. 1965년에 바다 건너 큰 나라가 이민 제도를 바꾸면서 아시아 사람도 이민을 가기 쉬워졌어.','먼저 떠난 친척이 편지를 보냈어. "이곳에서는 열심히 일하면 가게도 차릴 수 있어. 아이들 교육 기회도 많아."','1970년대에 나는 비행기를 타고 태평양을 건너 서쪽 바닷가의 큰 도시에 도착했어. 우리는 한국 식당과 가게가 모인 거리, 한인타운에서 새 삶을 시작했어.'],
  hf:'지도 왼쪽 아시아 상자에서 한반도의 남쪽이야.',ht:'북아메리카 서쪽 바닷가, 할리우드가 있는 도시야.'},
 {id:'hiroshi',cat:'as',who:'히로시',nat:'일본',natAlt:['일본'],era:'1908년',per:'1500~1914년',from:['392'],fromP:[186.5,482.9],fromName:'일본(고베)',to:'076',toP:[479,619.9],toName:'브라질(상파울루 산투스)',mot:0,pur:1,w:19,
  story:['나는 히로시야. 아시아 동쪽 바다 위 섬나라의 항구 고베에서 배를 탔어. 고향 농촌은 땅이 좁고 살기가 힘들었어.','\'지구 반대편 나라의 커피 농장에서 일하면 큰돈을 모을 수 있다\'는 광고가 붙었어.','1908년, 우리를 태운 배는 두 달 가까이 바다를 건너 남아메리카 남동부의 항구 산투스에 닿았어. 우리는 상파울루의 커피 농장에서 일하기 시작했어.'],
  hf:'아시아 상자 오른쪽, 바다 위의 섬나라야.',ht:'남아메리카에서 가장 큰 나라의 남동부야.'},
 {id:'ramu',cat:'as',who:'라무',nat:'인도',natAlt:['인도'],era:'1880년대',per:'1500~1914년',from:['356'],fromP:[73.6,518.2],fromName:'인도(콜카타)',to:'780',toP:[393.2,392.2],toName:'트리니다드 토바고',mot:0,pur:1,w:43,
  story:['나는 라무야. 남쪽으로 뾰족하게 튀어나온 아시아의 큰 나라, 그 동쪽 항구 콜카타 근처 농촌에서 왔어.','카리브해 섬들에서 노예 제도가 사라지자 사탕수수 농장에 일손이 모자랐어. 나는 몇 년 동안 농장에서 일하기로 계약서에 서명했어.','석 달 가까이 배를 타고 도착한 곳은 남아메리카 바로 앞바다의 섬이었어. 오늘날 이 섬나라 사람 셋 중 한 명은 우리처럼 인도에서 온 사람들의 후손이야.'],
  hf:'아시아 상자 왼쪽, 남쪽으로 뾰족하게 튀어나온 나라야.',ht:'베네수엘라 바로 앞바다의 섬나라야.'},
 {id:'marisel',cat:'as',who:'마리셀',nat:'필리핀',natAlt:['필리핀'],era:'1970년대',per:'20세기 이후',from:['608'],fromP:[154.7,541.5],fromName:'필리핀(마닐라)',to:'840',toP:[334.8,191.8],toName:'미국(뉴욕)',mot:0,pur:1,w:200,
  story:['나는 마리셀이야. 아시아 동남쪽 바다에 7천 개가 넘는 섬으로 이루어진 나라에서 왔어. 나는 수도 마닐라에서 간호학을 공부했어.','바다 건너 큰 나라의 병원들은 간호사가 크게 모자랐어. 우리 나라 간호사들은 영어를 잘해서 그곳 병원에서 많이 찾았지.','1970년대에 나는 비행기를 타고 태평양을 건너 북아메리카 동부의 큰 도시 병원에서 일하게 되었어.'],
  hf:'아시아 상자 오른쪽 아래, 섬이 많은 나라야.',ht:'북아메리카 동부의 가장 큰 도시야.'},

 {id:'sofia',cat:'hi',who:'소피아',nat:'멕시코',natAlt:['멕시코'],era:'2010년대',per:'20세기 이후',from:['484'],fromP:[164.1,325.9],fromName:'멕시코',to:'840',toP:[91.2,235.8],toName:'미국(로스앤젤레스)',mot:0,pur:1,w:1090,
  story:['나는 소피아야. 우리 마을은 북아메리카 남쪽 나라의 고원에 있어. 아빠는 농장에서 일하지만 품삯이 너무 적어.','국경 너머 이모가 영상 통화로 말했어. "여기서는 같은 일을 해도 훨씬 많이 벌어. 국경을 맞대고 있어서 버스로도 올 수 있고, 동네에서 에스파냐어가 다 통해."','우리 가족은 국경을 넘어 북쪽 큰 나라의 서쪽 바닷가 도시로 이사했어.'],
  hf:'미국 바로 남쪽에 붙어 있는 나라야.',ht:'북아메리카 가장 큰 나라의 서쪽 바닷가야.'},
 {id:'carmen',cat:'hi',who:'카르멘',nat:'엘살바도르',natAlt:['엘살바도르'],era:'1980년대',per:'20세기 이후',from:['222'],fromP:[237.3,371],fromName:'엘살바도르',to:'840',toP:[317.6,203.6],toName:'미국(워싱턴 D.C.)',mot:0,pur:0,w:141,
  story:['나는 카르멘이야. 중앙아메리카에서 가장 작은 나라, 태평양과 맞닿은 화산의 나라에서 왔어.','1980년대에 우리 나라에서는 정부와 반군이 싸우는 내전이 벌어졌어. 마을이 불타고 사람들이 다치는 것을 보고 우리 가족은 살기 위해 떠나기로 했어.','우리는 멕시코를 지나 북쪽으로 올라가, 바다 건너 큰 나라의 수도 근처에 자리 잡았어.'],
  hf:'중앙아메리카에서 가장 작은 나라, 태평양 쪽에 있어.',ht:'북아메리카 동부, 가장 큰 나라의 수도야.'},
 {id:'rafael',cat:'hi',who:'라파엘',nat:'쿠바',natAlt:['쿠바'],era:'1960년대',per:'20세기 이후',from:['192'],fromP:[293.4,317.3],fromName:'쿠바',to:'840',toP:[291.5,290.7],toName:'미국(마이애미)',mot:0,pur:0,w:136,
  story:['나는 라파엘이야. 카리브해에서 가장 큰 섬나라의 수도 아바나에서 살았어.','1959년 혁명이 일어나 새 정부가 들어섰어. 새 정부와 생각이 다른 사람들은 가게와 재산을 빼앗기고 자유롭게 말하기도 어려워졌어.','우리 가족은 바다 건너 가장 가까운 큰 나라의 남쪽 끝 반도로 떠났어. 그 도시에는 쿠바에서 온 사람들이 모여 사는 \'작은 아바나\'가 생겼어.'],
  hf:'카리브해에서 가장 큰 섬나라야.',ht:'북아메리카 가장 큰 나라의 남동쪽 끝, 플로리다반도야.'},
 {id:'juan',cat:'hi',who:'후안',nat:'도미니카 공화국',natAlt:['도미니카공화국','도미니카'],era:'1970년대',per:'20세기 이후',from:['214'],fromP:[342.8,337.2],fromName:'도미니카 공화국',to:'840',toP:[335.4,191.1],toName:'미국(뉴욕)',mot:0,pur:1,w:117,
  story:['나는 후안이야. 카리브해의 섬 하나를 이웃 나라와 나누어 쓰는 나라, 그 섬의 동쪽에서 왔어.','고향에서는 사탕수수 농장 일 말고는 일자리가 많지 않았어. 먼저 떠난 삼촌은 큰 도시의 공장에서 일하며 돈을 부쳐 왔지.','1970년대에 나는 비행기를 타고 북아메리카 동부의 가장 큰 도시로 갔어. 우리 동네에는 우리처럼 카리브해에서 온 사람들이 많아.'],
  hf:'카리브해 히스파니올라섬의 동쪽 나라야.',ht:'북아메리카 동부의 가장 큰 도시야.'}

function clamp(v){const a=asp();v.h=v.w*a;const mx=Math.max(W,H/a)*1.05;if(v.w>mx){const cx=v.x+v.w/2,cy=v.y+v.h/2;v.w=mx;v.h=mx*a;v.x=cx-v.w/2;v.y=cy-v.h/2}if(v.w<90){const cx=v.x+v.w/2,cy=v.y+v.h/2;v.w=90;v.h=90*a;v.x=cx-45;v.y=cy-v.h/2}
  const f=(s,sz,ext)=>sz>=ext?(ext-sz)/2:Math.min(Math.max(s,-sz*.15),ext-sz*.85);v.x=f(v.x,v.w,W);v.y=f(v.y,v.h,H);return v}

function fly(t,ms){t=clamp({...t});if(RM||!ms){setVB(t);return}const s={...vb},t0=performance.now();cancelAnimationFrame(tw);const st=n=>{const k=Math.min(1,(n-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;setVB({x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e});if(k<1)tw=requestAnimationFrame(st)};tw=requestAnimationFrame(st)}

function arc(r,a0,a1){const f=x=>x.toFixed(2);if(a1-a0>=2*Math.PI-1e-6)return `M${r},0A${r},${r} 0 1 1 ${-r},0A${r},${r} 0 1 1 ${r},0Z`;return `M0,0L${f(r*Math.cos(a0))},${f(r*Math.sin(a0))}A${r},${r} 0 ${a1-a0>Math.PI?1:0} 1 ${f(r*Math.cos(a1))},${f(r*Math.sin(a1))}Z`}
function pieSvg(d,hl){let a=-Math.PI/2,o='';d.p.forEach(([c,v])=>{const a1=a+v/100*2*Math.PI,m=(a+a1)/2,on=c===hl,k=on?6:0;o+=`<path d="${arc(56,a,a1)}" class="sl${on?' hl':''}" style="fill:var(--${c})" transform="translate(${(Math.cos(m)*k).toFixed(1)},${(Math.sin(m)*k).toFixed(1)})"/>`;a=a1});return `<svg viewBox="-64 -64 128 128" class="bigpie" aria-hidden="true">${o}</svg>`}

function lr(n,ws,minOne){const tot=ws.reduce((a,b)=>a+b,0),q=ws.map(w=>n*w/tot);let s=q.map(x=>minOne?Math.max(1,Math.floor(x)):Math.floor(x));let d=n-s.reduce((a,b)=>a+b,0);
  const rem=q.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]);let k=0;while(d>0){s[rem[k%rem.length][1]]++;d--;k++}
  const asc=q.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>a[0]-b[0]);k=0;while(d<0&&k<500){const i=asc[k%asc.length][1];if(s[i]>(minOne?1:0)){s[i]--;d++}k++}return s}
let ASSIGN=[],RANGE={},GRANGE={};
function allocate(N){N=Math.max(5,Math.min(60,N|0));const gs=lr(N,CORDER.map(c=>CW[c]),true);ASSIGN=[];RANGE={};GRANGE={};let no=1;
  CORDER.forEach((c,gi)=>{const m=gs[gi],rs=ROLES.filter(r=>r.cat===c);let per;
    if(m<=rs.length)per=rs.map((_,i)=>i<m?1:0);else{const extra=lr(m-rs.length,rs.map(r=>r.w),false);per=extra.map(x=>x+1)}
    GRANGE[c]=[no,no+m-1];
    rs.forEach((r,i)=>{if(!per[i])return;RANGE[r.id]=[no,no+per[i]-1];for(let k=0;k<per[i];k++)ASSIGN[no++]=r.id})})}
allocate(S.size);

     <div class="szrow"><label for="szIn">학급 인원</label><input id="szIn" type="number" min="5" max="60" value="${S.size}"><button type="button" class="ghost" id="bSz">번호 다시 배정</button><button type="button" class="ghost" id="bSheet">활동지 ② 표 보기</button><button type="button" class="ghost" id="bLive">실시간 선 ${S.live?'끄기':'켜기'}</button></div></div>`:''}
   <div class="fin">${S.final?`<p class="small">지금은 <b>최종 결과</b>를 보고 있어.</p><button type="button" class="ghost" id="bFinal">공개 순서로 돌아가기</button>`:canFinal?`<button type="button" class="btn primary" id="bFinal">최종 결과 보기</button>`:`<p class="small">최종 결과는 제출한 뒤에 볼 수 있어.</p>`}</div>
   <ol class="order">${CORDER.map((c,i)=>`<li class="${i<shown()?'on':''}" style="--c:${CAT[c].c}"><b>${i+1}</b><div>${CAT[c].n} <em>${rng(GRANGE[c])}</em></div><span>${ROLES.filter(r=>r.cat===c&&cntOf(r.id)).map(r=>`${r.who} ${sc[r.id]||0}/${cntOf(r.id)}`).join(' · ')}</span></li>`).join('')}</ol>
   ${rows?`<div class="tw"><table class="rt"><tr><th>번호</th><th>주인공</th><th>국적</th><th>출발한 곳 → 도착한 곳</th><th>동기</th><th>목적</th></tr>${rows}</table></div>`:'<p class="small">아직 공개된 이동이 없어.</p>'}
   ${shown()>=5?`<div class="qs"><p class="sh">완성된 지도를 보고 답하자 (활동지 ② 3번)</p><ol><li>강제적 이동을 나타낸 화살표는 어느 대륙에서 출발했는가?</li><li>'종교'를 이유로 이동한 사람은 누구인가? '정치'를 이유로 이동한 사람은?</li><li>원주민계 인물들은 왜 화살표가 아니라 ★로 표시했을까?</li><li>가장 굵은 화살표 다발은 어느 대륙에서 출발했는가? 이것이 오늘날 아메리카의 민족(인종) 구성과 어떤 관계가 있을까?</li></ol></div>`:''}
   <div class="lg"><span><svg width="30" height="10"><path d="M2 5H28" stroke="currentColor" stroke-width="2.4"/></svg>자발적 이동</span><span><svg width="30" height="10"><path d="M2 5H28" stroke="currentColor" stroke-width="2.4" stroke-dasharray="5 4"/></svg>강제적 이동</span><span><svg width="14" height="14"><path d="M7 0L8.6 5H14L9.7 8L11.3 13L7 10L2.7 13L4.3 8L0 5H5.4Z" fill="currentColor"/></svg>이동하지 않음</span><span>선의 굵기 = 맡은 학생 수</span></div>
   <details class="basis"><summary>번호 배정 기준</summary><p>집단별 인원은 ① 오늘날 아메리카의 민족(인종) 구성(혼혈·기타 제외)과 ② 시기별 이주 규모를 절반씩 섞어 정하고, 모든 집단에 최소 1명을 보장했다. 같은 집단 안에서는 대표 이주 흐름에 먼저 1명씩 배정한 뒤, 남는 자리를 이주 규모에 비례해 나눴다.</p><p>① 『신상 지리 자료』(2023, 라틴 아메리카 13개국, 2019년), 미국 인구 조사국(2020) ② 대서양 노예 무역 아메리카 도착 약 1,070만 명(Trans-Atlantic Slave Trade Database), 1820~1930년 유럽인의 아메리카 이주 약 5,000만 명, 19세기 아시아인의 계약 노동 이주와 1965년 이후 미국의 아시아·라틴 아메리카 출신 이민(미국 인구 조사국 ACS). 수치는 반올림한 근사치이다.</p></details>`;
  if(S.teacher){$('bPrev').onclick=()=>{S.final=false;setReveal(S.reveal-1)};$('bNext').onclick=()=>setReveal(S.reveal+1);$('bAllOpen').onclick=()=>setReveal(5);
    $('bSz').onclick=()=>{const v=Math.max(5,Math.min(60,+$('szIn').value||30));if(Object.keys(S.subs).length&&!confirm('이미 제출한 학생이 있어요. 번호 배정을 바꿀까요?'))return;setState({size:v})};
    $('bSheet').onclick=()=>{S.sheet=true;renderSheet()};$('bLive').onclick=()=>setState({live:!S.live})}
  const bf=$('bFinal');if(bf)bf.onclick=()=>{S.final=!S.final;render();fitAll(500)}}
async function setReveal(n){S.reveal=Math.max(0,Math.min(5,n));setState({step:S.reveal})}
async function setState(o){if('size' in o){S.size=o.size;allocate(S.size)}if('step' in o)S.reveal=o.step;if('live' in o)S.live=o.live;render();if(db){try{await db.doc('a2c/main/state/reveal').set({step:S.reveal,size:S.size,live:S.live})}catch(e){note('저장하지 못했어요.')}}}
function renderSheet(){const m=$('sheet');if(!S.sheet){m.hidden=true;return}
  const rows=CORDER.map((c,i)=>{const rs=ROLES.filter(r=>r.cat===c&&cntOf(r.id));return rs.map((r,j)=>`<tr>${j===0?`<td rowspan="${rs.length}">${i+1}<br>${CAT[c].n}</td>`:''}<td class="nb">${rng(RANGE[r.id])}</td><td>${r.who}</td><td></td><td></td><td></td><td></td></tr>`).join('')}).join('');
  m.innerHTML=`<div class="am"><div class="ah2"><h3>활동지 ② 2번 표 · 학급 ${S.size}명</h3><button type="button" class="ghost" id="shClose">닫기</button></div><p class="small">번호와 주인공은 미리 채우고, 국적·경로·동기·목적은 학생이 공개 순서대로 채운다. 표를 복사해 활동지에 붙여 넣으면 된다.</p>
   <div class="tw"><table class="rt sh" id="shTbl"><tr><th>공개 순서</th><th>번호</th><th>주인공</th><th style="width:16%">국적</th><th style="width:30%">출발한 곳 → 도착한 곳</th><th style="width:11%">동기</th><th style="width:11%">목적</th></tr>${rows}</table></div>
   <div class="af"><button type="button" class="btn primary" id="shCopy">표 복사</button></div></div>`;m.hidden=false;
  $('shClose').onclick=()=>{S.sheet=false;m.hidden=true};
  $('shCopy').onclick=async()=>{const t=$('shTbl');try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([t.outerHTML],{type:'text/html'}),'text/plain':new Blob([t.innerText],{type:'text/plain'})})]);note('표를 복사했어요. 활동지에 붙여 넣으세요.')}catch(e){try{await navigator.clipboard.writeText(t.innerText);note('표를 텍스트로 복사했어요.')}catch(_){note('복사하지 못했어요. 표를 직접 선택해 복사해 주세요.')}}}}
const SEEN=new Set();
function drawLive(){gLive.innerHTML='';if(!S.live)return;
  Object.entries(S.subs).forEach(([id,s])=>{const r=s&&ROLES.find(x=>x.id===s.role);if(!r)return;const col=CAT[r.cat].c,j=(((s.num||0)%7)-3)*2.2,isNew=!SEEN.has(id),mine=id===myId||id==='local';SEEN.add(id);if(isNew&&S.loaded!==undefined)arrivalFx(r,s,col);
    if(r.stay){star(r.homeP[0]+j,r.homeP[1]+j,7,col,gLive);return}
    mk('path',{d:curve([r.fromP[0]+j,r.fromP[1]+j],[r.toP[0]+j*.6,r.toP[1]+j*.6]),class:'live'+(r.mot===1?' force':'')+(isNew?' new':'')+(mine?' mine':''),stroke:col},gLive)});drawLive.first=false}
function arrivalFx(r,s,col){const p=r.stay?r.homeP:r.toP;if(!p)return;
  for(let i=0;i<2;i++){const c=mk('circle',{cx:p[0],cy:p[1],r:4,class:'ripple',style:`stroke:${col};animation-delay:${i*.35}s`},gFx);setTimeout(()=>c.remove(),2200)}
  let f=$('feed');if(!f){f=document.createElement('div');f.id='feed';f.setAttribute('aria-live','polite');$('stage').appendChild(f)}
  const it=document.createElement('div');it.className='fi';it.style.setProperty('--c',col);it.innerHTML=r.stay?`<b>${s.num}번</b> ${r.who}가 자기 땅 <b>${r.nat}</b>에 ★를 찍었어`:`<b>${s.num}번</b> ${r.who}가 <b>${r.fromName.replace(/\(.*\)/,'')}</b> → <b>${r.toName.replace(/\(.*\)/,'')}</b>에 도착했어`;
  f.prepend(it);while(f.children.length>4)f.lastChild.remove();setTimeout(()=>{it.classList.add('out');setTimeout(()=>it.remove(),600)},7000)}
drawLive.first=true;
let lastSend=0;
function sendCursor(e){if(!room)return;const now=performance.now();if(now-lastSend<(window.claude&&window.claude.gh?100:40))return;lastSend=now;const [x,y]=toSvg(e.clientX,e.clientY);room.presence({c:[+x.toFixed(1),+y.toFixed(1)],n:S.num,f:S.done?null:S.from,cat:S.role?R().cat:null}).catch(()=>{})}
function drawCursors(){if(typeof gCur==='undefined')return;gCur.innerHTML='';if(!room||!S.cursors)return;const k=vb.w/(svg.getBoundingClientRect().width||1);
  room.peers().forEach(p=>{if(p.sameTab||!p.presence)return;const pr=p.presence,col=pr.cat?CAT[pr.cat].c:'#5a6b78';
    if(pr.n&&pr.f){const r=ROLES.find(x=>x.id===ASSIGN[pr.n]);if(r&&r.fromP)mk('circle',{cx:r.fromP[0],cy:r.fromP[1],r:5.5,class:'pin pend',style:`fill:${col}`},gCur)}
    if(!Array.isArray(pr.c))return;const g=mk('g',{transform:`translate(${pr.c[0]},${pr.c[1]}) scale(${k})`},gCur);
    mk('path',{d:'M0,0 L0,17 L4.5,12.5 L8,20 L11,18.5 L7.5,11.5 L13,11.5 Z',fill:col,stroke:'#fff','stroke-width':1.4},g);
    const lb=pr.n?pr.n+'번':'친구';mk('rect',{x:10,y:16,rx:4,height:18,width:lb.length*9+12,fill:col},g);const t=mk('text',{x:16,y:29,class:'cname'},g);t.textContent=lb})}
function drawMap(){drawLive();gFlow.innerHTML='';gPin.innerHTML='';const LBL={};
  const cls=S.view==='class',list=cls?ROLES.filter(r=>revealed().has(r.cat)&&cntOf(r.id)):(S.role?[R()]:[]);
  list.forEach(r=>{const col=CAT[r.cat].c,n=cntOf(r.id),wd=cls?1.6+1.1*n:2.8;
    if(r.stay){if(cls||S.done){star(r.homeP[0],r.homeP[1],cls?10+2*n:14,col,gPin);if(cls){const t=mk('text',{x:r.homeP[0]+14,y:r.homeP[1]+5,class:'nm'},gPin);t.textContent=r.who}}return}
    const showFrom=cls||S.from,showTo=cls||S.to;
    if(showFrom)mk('circle',{cx:r.fromP[0],cy:r.fromP[1],r:4.5,class:'pin',style:`fill:${col}`},gPin);
    if(showFrom&&showTo){mk('path',{d:curve(r.fromP,r.toP),class:'flow'+(r.mot===1?' force':''),stroke:col,style:`stroke-width:${wd}px`,'marker-end':`url(#ar-${r.cat})`},gFlow);
      if(cls){const key=Math.round(r.toP[0]/12)+','+Math.round(r.toP[1]/12);(LBL[key]=LBL[key]||{p:r.toP,names:[]}).names.push(r.who)}}});
  Object.values(LBL).forEach(o=>{const t=mk('text',{x:o.p[0]+7,y:o.p[1]-7,class:'nm'},gPin);t.textContent=o.names.join('·')});}
function setView(v){S.view=v;clearMarks();$('tip').hidden=true;render();fitAll(400)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='class'&&!S.unlocked){askPw();return}setView(b.dataset.view)});
function askPw(){let m=$('pw');if(!m){m=document.createElement('div');m.id='pw';document.body.appendChild(m)}
  m.innerHTML=`<div class="pwbox" role="dialog" aria-label="선생님 확인"><h3>우리 반 지도는 선생님 화면이에요</h3><p>선생님이 공개하면 큰 화면으로 함께 볼 거예요. 선생님은 비밀번호를 입력해 주세요.</p><div class="natrow"><input type="password" id="pwIn" inputmode="numeric" autocomplete="off" placeholder="비밀번호"><button type="button" class="btn primary" id="pwOk">확인</button></div><p class="msg" id="pwMsg"></p><button type="button" class="ghost" id="pwNo">닫기</button></div>`;m.hidden=false;
  const ok=()=>{if($('pwIn').value==='1234'){S.unlocked=true;if(window.claude&&window.claude.gh)S.teacher=true;m.hidden=true;setView('class')}else{$('pwMsg').textContent='비밀번호가 맞지 않아요.';$('pwMsg').className='msg bad'}};
  $('pwOk').onclick=ok;$('pwIn').onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')m.hidden=true};$('pwNo').onclick=()=>{m.hidden=true};setTimeout(()=>$('pwIn').focus(),50)}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));svg.classList.toggle('picking',picking());svg.classList.toggle('mev',S.view==='me');const bc=$('bCur');if(bc){bc.setAttribute('aria-pressed',S.cursors);bc.onclick=()=>{S.cursors=!S.cursors;render();drawCursors()}}
  $('nick').textContent=S.role?`${S.num}번 ${R().who}`:'';$('nick').hidden=!S.role;renderPanel();drawMap();renderPeople();if(S.sheet)renderSheet()}
function note(t){const n=$('note');n.textContent=t;n.hidden=!t;clearTimeout(note.t);if(t)note.t=setTimeout(()=>n.hidden=true,5000)}
function renderPeople(){const b=$('people'),k=Object.keys(S.subs).length,pc=Math.min(100,Math.round(k/S.size*100));b.innerHTML=`<span class="arr">우리 반 도착 <b>${k}</b>/${S.size}</span><span class="pbar"><i style="width:${pc}%"></i></span>${room?`<span class="onl"><i></i>접속 ${room.peers().length}명</span>`:''}`}

render();fitAll(0);
(async()=>{const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  user=await use('user');if(user){try{myId=await user.id()}catch(_){}try{S.teacher=!!user.canEdit()}catch(_){}}
  db=await use('db');
  if(db){db.collection('a2c/main/subs').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());if(!S.loaded){Object.keys(m).forEach(k=>SEEN.add(k));S.loaded=true}S.subs=m;render()},()=>{});
    db.doc('a2c/main/state/reveal').onSnapshot(s=>{const d=s.exists?s.data():null;S.reveal=(d&&d.step)||0;S.live=!(d&&d.live===false);const sz=(d&&d.size)||30;if(sz!==S.size){S.size=sz;allocate(sz)}render()},()=>{})}
  else{S.teacher=true;note('실시간 연결이 설정되지 않아 이 기기에서만 작동해요. (index.html의 FIREBASE_CONFIG를 확인하세요)')}
  room=await use('room');if(room){room.onPeers(()=>{renderPeople();drawCursors()})}
  render()})();
})();
</script></body></html>
